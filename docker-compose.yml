services:

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: becas_app
    restart: unless-stopped

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: becas_uptex
      DB_USERNAME: becas_user
      DB_PASSWORD: becas_password

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - becas_network


  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile

    container_name: becas_nginx

    restart: unless-stopped

    ports:
      - "8000:80"

    depends_on:
      - app

    networks:
      - becas_network


  db:
    image: mysql:8.4

    container_name: becas_db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: becas_uptex
      MYSQL_USER: becas_user
      MYSQL_PASSWORD: becas_password
      MYSQL_ROOT_PASSWORD: root_password

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - becas_network


  redis:
    image: redis:7-alpine

    container_name: becas_redis

    restart: unless-stopped

    volumes:
      - redis_data:/data

    networks:
      - becas_network


volumes:
  mysql_data:
  redis_data:


networks:
  becas_network:
    driver: bridge